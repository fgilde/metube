name: update-yt-dlp

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# The default GITHUB_TOKEN is enough here: contents:write lets the job push the
# lock bump, actions:write lets it start the build. A push made with the
# GITHUB_TOKEN triggers no other workflow, so the build is dispatched
# explicitly instead (workflow_dispatch is the documented exception).
permissions:
  contents: write
  actions: write

jobs:
  update-yt-dlp:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      -
        name: Install uv
        uses: astral-sh/setup-uv@v7
      -
        name: Update yt-dlp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv sync --locked
          # Check if yt-dlp has updates available
          LATEST_VERSION=$(uv pip list --outdated --format json | jq -r '.[] | select(.name == "yt-dlp") | .latest_version')
          CURRENT_VERSION=$(uv pip list --format json | jq -r '.[] | select(.name == "yt-dlp") | .version')
          if [ -n "$LATEST_VERSION" ] && [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            echo "Updating yt-dlp from $CURRENT_VERSION to $LATEST_VERSION"
            uv lock --upgrade-package yt-dlp
            git config --global user.email "updater@metube"
            git config --global user.name "AutoUpdater"
            git add uv.lock
            git commit -m "upgrade yt-dlp from $CURRENT_VERSION to $LATEST_VERSION"
            git push
            gh workflow run main.yml --ref "${GITHUB_REF_NAME}"
          else
            echo "yt-dlp is already up to date ($CURRENT_VERSION)"
          fi
